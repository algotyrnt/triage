name: Bug Report
description: Create a report to help us reproduce and fix a bug
labels: ["kind/bug", "status/triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please search existing issues before filing a new one to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of Triage is experiencing the issue?
      options:
        - "Engine (Server / API / AST Slicing / SQLite)"
        - "Studio Dashboard (React / Vite UI)"
        - "Go SDK (github.com/algotyrnt/triage/sdk/go)"
        - "Docker Container"
        - "Documentation / Web"
        - "CLI / Configuration"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Start triage server with flags '...'
        2. Integrate Go SDK into HTTP server
        3. Trigger panic at route '/test'
        4. See error in dashboard or console
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Stack Traces
      description: Please provide server logs, console errors, or stack traces (strip any sensitive credentials).
      render: shell

  - type: input
    id: triage_version
    attributes:
      label: Triage Version / Docker Tag
      description: e.g., v0.1.0, latest, or git commit sha.
      placeholder: v0.1.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Go version (e.g. Linux amd64, macOS arm64, Go 1.24.0).
      placeholder: macOS Sequoia (arm64), Go 1.26.5, Docker 27.x
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues and verified this is not a duplicate.
          required: true
        - label: I have confirmed that logs or stack traces do not contain private API keys or secrets.
          required: true
