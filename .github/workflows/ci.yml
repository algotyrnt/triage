name: Triage CI Pipeline

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: ${{ matrix.component.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - name: engine
            lint: make lint-engine
            test: make test-engine
            build: make build-engine
          - name: sdk
            lint: make lint-sdk
            test: make test-sdk
            build: make build-sdk
          - name: test-service
            lint: make lint-test-service
            test: ''
            build: make build-test-service
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Check Formatting & Vet
        run: ${{ matrix.component.lint }}

      - name: Run Tests
        if: matrix.component.test != ''
        run: ${{ matrix.component.test }}

      - name: Build Binary
        run: ${{ matrix.component.build }}

  frontend:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, dashboard]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        working-directory: apps/${{ matrix.app }}
        run: bun install --frozen-lockfile

      - name: Check Formatting
        run: make lint-${{ matrix.app }}

      - name: Build Application
        run: make build-${{ matrix.app }}
