name: Triage CI Pipeline

on:
    pull_request:
        branches: [main]

jobs:
    test-go:
        name: Go Services & SDK Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.26"

            - name: Run Manager Tests
              run: |
                  cd apps/manager
                  go test -v ./...

            - name: Run Engine Tests
              run: |
                  cd apps/engine
                  go test -v ./...

            - name: Run SDK Tests
              run: |
                  cd sdk/go
                  go test -v ./...

    build-web:
        name: Public Web & Dashboard Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install Dependencies
              run: bun install

            - name: Build Web Application
              working-directory: apps/web
              run: bun run build
