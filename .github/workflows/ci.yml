name: Triage CI Pipeline

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      sdk: ${{ steps.filter.outputs.sdk }}
      web: ${{ steps.filter.outputs.web }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            engine:
              - 'apps/engine/**'
            sdk:
              - 'sdk/go/**'
            web:
              - 'apps/web/**'
            dashboard:
              - 'apps/dashboard/**'

  engine:
    name: engine
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: false
          cache: true
          cache-dependency-path: apps/engine/go.sum

      - name: Cache Go Build & Test Artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-engine-${{ hashFiles('apps/engine/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-go-build-engine-${{ hashFiles('apps/engine/go.sum') }}-
            ${{ runner.os }}-go-build-engine-

      - name: Check Engine Formatting & Vet
        run: make lint-engine

      - name: Run Engine Tests
        run: make test-engine

      - name: Build Engine Binary
        run: make build-engine

  sdk:
    name: sdk/go
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: false

      - name: Cache Go Build & Test Artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-sdk-${{ hashFiles('sdk/go/go.mod') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-go-build-sdk-${{ hashFiles('sdk/go/go.mod') }}-
            ${{ runner.os }}-go-build-sdk-

      - name: Check SDK Formatting & Vet
        run: make lint-sdk

      - name: Run Go SDK Tests
        run: make test-sdk

      - name: Build Go SDK
        run: make build-sdk

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-web-${{ hashFiles('apps/web/bun.lock*') }}
          restore-keys: |
            ${{ runner.os }}-bun-web-

      - name: Install Web Dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Check Web Formatting
        run: make lint-web

      - name: Build Web Application
        run: make build-web

  dashboard:
    name: dashboard
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-dashboard-${{ hashFiles('apps/dashboard/bun.lock*') }}
          restore-keys: |
            ${{ runner.os }}-bun-dashboard-

      - name: Install Dashboard Dependencies
        working-directory: apps/dashboard
        run: bun install --frozen-lockfile

      - name: Check Dashboard Formatting
        run: make lint-dashboard

      - name: Build Dashboard Application
        run: make build-dashboard
