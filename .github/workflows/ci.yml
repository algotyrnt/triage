name: Triage CI Pipeline

on:
  pull_request:
    branches: [main]

jobs:
  format-check:
    name: Code Formatting & Lint Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check Go Formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted Go files detected:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Check Web Formatting
        working-directory: apps/web
        run: |
          bun install --frozen-lockfile
          bun run format:check

      - name: Check Dashboard Formatting
        working-directory: apps/dashboard
        run: |
          bun install --frozen-lockfile
          bun run format:check

  test-go:
    name: Go Engine, SDK & Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: Verify Engine
        working-directory: apps/engine
        run: |
          go vet ./...
          go build ./...
          go test -v ./...

      - name: Verify SDK
        working-directory: sdk/go
        run: |
          go vet ./...
          go build ./...
          go test -v ./...

      - name: Verify Test Service
        working-directory: test-service
        run: |
          go vet ./...
          go build ./...

  build-apps:
    name: Frontend Applications Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Web (Astro)
        working-directory: apps/web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build Dashboard (Next.js)
        working-directory: apps/dashboard
        run: |
          bun install --frozen-lockfile
          bun run build
