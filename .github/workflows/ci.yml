name: Triage CI Pipeline

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: apps/engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: Check Go Formatting & Vet
        run: make lint-go

      - name: Verify Engine
        run: make test-engine

      - name: Verify SDK
        run: make test-sdk

      - name: Verify Test Service
        run: make test-service-build

  web:
    name: apps/web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Check Formatting
        run: make lint-web

      - name: Build Web
        run: make build-web

  dashboard:
    name: apps/dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        working-directory: apps/dashboard
        run: bun install --frozen-lockfile

      - name: Check Formatting
        run: make lint-dashboard

      - name: Build Dashboard
        run: make build-dashboard
