name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      triage: ${{ steps.filter.outputs.triage }}
      sdk: ${{ steps.filter.outputs.sdk }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            triage:
              - 'engine/**'
              - 'dashboard/**'
              - 'Makefile'
              - 'Dockerfile'
              - '.github/workflows/**'
              - '.golangci.yml'
              - 'codecov.yml'
            sdk:
              - 'sdk/go/**'
              - 'Makefile'
              - '.github/workflows/**'
              - '.golangci.yml'
              - 'codecov.yml'
            web:
              - 'web/**'
              - 'Makefile'
              - '.github/workflows/**'

  triage:
    name: triage
    needs: changes
    if: needs.changes.outputs.triage == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-dashboard-${{ hashFiles('dashboard/bun.lock*') }}
          restore-keys: |
            ${{ runner.os }}-bun-dashboard-

      - name: Install & Lint Dashboard
        working-directory: dashboard
        run: |
          bun install --frozen-lockfile
          bun run format:check

      - name: Build Embedded Dashboard UI
        run: make build-dashboard

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: false
          cache: true
          cache-dependency-path: engine/go.sum

      - name: Check Engine Formatting
        run: make lint-engine

      - name: Run Engine golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          install-mode: "goinstall"
          working-directory: engine
          args: --timeout=5m

      - name: Run Engine Tests (with Race Detector)
        run: |
          mkdir -p engine/internal/ui/dist && touch engine/internal/ui/dist/.gitkeep
          cd engine && go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload Engine Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: engine/coverage.out
          flags: engine
          fail_ci_if_error: false

      - name: Build Unified Triage Binary
        run: make build-triage

  sdk:
    name: sdk/go (Go ${{ matrix.go-version }})
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.22", "1.23", "1.24", "1.26"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: false
          cache: true
          cache-dependency-path: sdk/go/go.mod

      - name: Check SDK Formatting & Vet
        run: make lint-sdk

      - name: Run SDK golangci-lint
        if: matrix.go-version == '1.26'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          install-mode: "goinstall"
          working-directory: sdk/go
          args: --timeout=5m

      - name: Run Go SDK Tests (with Race Detector)
        run: |
          cd sdk/go && go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload SDK Coverage to Codecov
        if: matrix.go-version == '1.26'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: sdk/go/coverage.out
          flags: sdk
          fail_ci_if_error: false

      - name: Build Go SDK
        run: make build-sdk

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-web-${{ hashFiles('web/bun.lock*') }}
          restore-keys: |
            ${{ runner.os }}-bun-web-

      - name: Install Web Dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Check Web Formatting
        run: make lint-web

      - name: Build Web Application
        run: make build-web

  ci-gate:
    name: CI Checks Passed
    needs: [changes, triage, sdk, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify All Job Results
        run: |
          CHANGES_RESULT="${{ needs.changes.result }}"
          TRIAGE_RESULT="${{ needs.triage.result }}"
          SDK_RESULT="${{ needs.sdk.result }}"
          WEB_RESULT="${{ needs.web.result }}"

          echo "========================================"
          echo "Job Evaluation Results:"
          echo "  - changes: $CHANGES_RESULT"
          echo "  - triage:  $TRIAGE_RESULT"
          echo "  - sdk:     $SDK_RESULT"
          echo "  - web:     $WEB_RESULT"
          echo "========================================"

          FAILED=0
          for RESULT in "$CHANGES_RESULT" "$TRIAGE_RESULT" "$SDK_RESULT" "$WEB_RESULT"; do
            if [ "$RESULT" = "failure" ] || [ "$RESULT" = "cancelled" ]; then
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more CI jobs failed or were cancelled."
            exit 1
          fi

          echo "All active jobs passed successfully."
