name: Triage CI Pipeline

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      triage: ${{ steps.filter.outputs.triage }}
      sdk: ${{ steps.filter.outputs.sdk }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            triage:
              - 'engine/**'
              - 'dashboard/**'
              - 'Makefile'
              - 'Dockerfile'
            sdk:
              - 'sdk/go/**'
              - 'Makefile'
            web:
              - 'web/**'
              - 'Makefile'

  triage:
    name: triage
    needs: changes
    if: needs.changes.outputs.triage == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-dashboard-${{ hashFiles('dashboard/bun.lock*') }}
          restore-keys: |
            ${{ runner.os }}-bun-dashboard-

      - name: Install & Lint Dashboard
        working-directory: dashboard
        run: |
          bun install --frozen-lockfile
          bun run format:check

      - name: Build Embedded Dashboard UI
        run: make build-dashboard

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: false
          cache: true
          cache-dependency-path: engine/go.sum

      - name: Cache Go Build Artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-engine-${{ hashFiles('engine/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-go-build-engine-${{ hashFiles('engine/go.sum') }}-
            ${{ runner.os }}-go-build-engine-

      - name: Check Engine Formatting & Vet
        run: make lint-engine

      - name: Run Engine Tests
        run: make test-engine

      - name: Build Unified Triage Binary
        run: make build-triage

  sdk:
    name: sdk/go
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: false

      - name: Cache Go Build Artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-sdk-${{ hashFiles('sdk/go/go.mod') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-go-build-sdk-${{ hashFiles('sdk/go/go.mod') }}-
            ${{ runner.os }}-go-build-sdk-

      - name: Check SDK Formatting & Vet
        run: make lint-sdk

      - name: Run Go SDK Tests
        run: make test-sdk

      - name: Build Go SDK
        run: make build-sdk

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-web-${{ hashFiles('web/bun.lock*') }}
          restore-keys: |
            ${{ runner.os }}-bun-web-

      - name: Install Web Dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Check Web Formatting
        run: make lint-web

      - name: Build Web Application
        run: make build-web
