name: Release Pipeline

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  sdk:
    name: Release & Index Go SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and Push Go SDK Tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          SDK_TAG="sdk/go/${TAG}"
          echo "Processing SDK Tag: $SDK_TAG"

          if git rev-parse "$SDK_TAG" >/dev/null 2>&1; then
            echo "Tag $SDK_TAG already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$SDK_TAG" -m "Release SDK $TAG"
            git push origin "$SDK_TAG"
            echo "Pushed tag $SDK_TAG"
          fi

      - name: Warm Go Proxy & pkg.go.dev Cache
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "Waiting for upstream ref propagation..."
          sleep 5
          echo "Warming Go module cache for github.com/${{ github.repository }}/sdk/go@$TAG"
          curl -s -f "https://proxy.golang.org/github.com/${{ github.repository }}/sdk/go/@v/${TAG}.info" || true

  binaries:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: false
          cache: true
          cache-dependency-path: engine/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dashboard Dependencies
        working-directory: dashboard
        run: bun install --frozen-lockfile

      - name: Package Cross-Platform Binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: make package VERSION="$VERSION"

      - name: Upload Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: dist-bin/*
          retention-days: 1

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=triage
          cache-to: type=gha,mode=max,scope=triage

  web:
    name: Build & Deploy Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Web Dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build Astro Web Application
        env:
          VERSION: ${{ github.ref_name }}
        run: make build-web VERSION="$VERSION"

      - name: Deploy Web to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun x wrangler deploy

  publish-release:
    name: Publish GitHub Release
    needs: [sdk, binaries, docker, web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Release Binaries
        uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist-bin

      - name: Create Draft Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Triage ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') || startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: true
          files: |
            dist-bin/*
          body: |
            ## Triage ${{ github.ref_name }}

            ### Server Deployment

            #### Docker (Preferred & Recommended)
            Run the official multi-architecture single-container image with embedded SQLite storage and studio dashboard:
            ```bash
            docker run -d \
              --name triage \
              -p 8080:8080 \
              -v triage_data:/data \
              ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            #### Standalone Binary (Alternative)
            Download the pre-compiled binary for your architecture from the release assets below, extract it, and run:
            ```bash
            ./triage --port=8080 --data-dir=./data
            ```

            ---

            ### Go SDK Middleware

            Add the official panic recovery middleware to your Go service:
            ```bash
            go get github.com/${{ github.repository }}/sdk/go@${{ github.ref_name }}
            ```

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" --draft=false
