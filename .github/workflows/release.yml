name: Release Pipeline

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  sdk:
    name: Release & Index Go SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and Push Go SDK Tag
        run: |
          TAG="${{ github.ref_name }}"
          SDK_TAG="sdk/go/${TAG}"
          echo "Processing SDK Tag: $SDK_TAG"

          if git rev-parse "$SDK_TAG" >/dev/null 2>&1; then
            echo "Tag $SDK_TAG already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$SDK_TAG" -m "Release SDK $TAG"
            git push origin "$SDK_TAG"
            echo "Pushed tag $SDK_TAG"
          fi

      - name: Warm Go Proxy & pkg.go.dev Cache
        run: |
          TAG="${{ github.ref_name }}"
          echo "Waiting for upstream ref propagation..."
          sleep 5
          echo "Warming Go module cache for github.com/${{ github.repository }}/sdk/go@$TAG"
          curl -s -f "https://proxy.golang.org/github.com/${{ github.repository }}/sdk/go/@v/${TAG}.info" || true

  docker:
    name: docker (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - name: engine
            context: ./apps/engine
            file: ./apps/engine/Dockerfile
            arg: VERSION
          - name: dashboard
            context: ./apps/dashboard
            file: ./apps/dashboard/Dockerfile
            arg: APP_VERSION
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image.name }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern=v{{version}}
            type=raw,value=latest

      - name: Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            ${{ matrix.image.arg }}=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  web:
    name: Build, Package & Deploy Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Web Dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Build Astro Web Application
        run: make build-web

      - name: Package Web Distribution Tarball
        run: tar -czf "triage-web-${{ github.ref_name }}.tar.gz" -C apps/web/dist .

      - name: Upload Web Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: triage-web-${{ github.ref_name }}.tar.gz

      - name: Deploy Web to Cloudflare Pages
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun x wrangler deploy

  publish-release:
    name: Publish GitHub Release
    needs: [sdk, docker, web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Web Distribution Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: ./

      - name: Create Draft Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Triage ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') || startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: true
          files: |
            docker-compose.prod.yml
            triage-web-${{ github.ref_name }}.tar.gz
          body: |
            ## Triage ${{ github.ref_name }}

            ### Quick Installation

            #### Go SDK
            ```bash
            go get github.com/${{ github.repository }}/sdk/go@${{ github.ref_name }}
            ```

            #### Self-Hosting with Docker Compose
            ```bash
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/docker-compose.prod.yml" -o docker-compose.prod.yml

            POSTGRES_PASSWORD=your_secure_password docker compose -f docker-compose.prod.yml up -d
            ```

            #### Pre-built Docker Images
            - **Engine**: `docker pull ghcr.io/${{ github.repository }}-engine:${{ github.ref_name }}`
            - **Dashboard**: `docker pull ghcr.io/${{ github.repository }}-dashboard:${{ github.ref_name }}`

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" --draft=false
